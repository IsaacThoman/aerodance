# Serves the static Studio build in its production image (see the Dockerfile). The game's
# root nginx.conf also proxies phone pairing, which the Studio doesn't run.

server {
    listen 3000;
    root /usr/share/nginx/html;
    # Keep directory redirects relative, so they stay on the proxy's public https URL.
    absolute_redirect off;
    gzip on;

    # Not in every nginx mime.types; MediaPipe needs application/wasm to compile its runtime.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
    }
}
