# XcodeGen spec for the iPhone/iPad app; scripts/ios.ts generates the project and builds it.
# The team and bundle ID come from IOS_TEAM_ID and IOS_BUNDLE_ID.
name: Aerodance
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Aerodance:
    type: application
    platform: iOS
    sources:
      - path: src/main.m
      - path: src/inject.js
        buildPhase: resources
      # The production web build, copied here by scripts/ios.ts.
      - path: www
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: WebKit.framework
      - sdk: AVKit.framework
      - sdk: MediaPlayer.framework
      - sdk: Network.framework
    # XcodeGen writes Info.plist from these properties.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: aerodance
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIRequiredDeviceCapabilities: [metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The phone's scene, plus the TV's when a display connects (AirPlay or a cable). iOS
        # only offers the TV scene to apps that declare the role here.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Phone
                UISceneDelegateClassName: PhoneSceneDelegate
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: TV
                UISceneDelegateClassName: TVSceneDelegate
        NSCameraUsageDescription: aerodance can use this camera to follow your dance moves. The video stays on this device.
        # HTTPS only (pairing, through the system), so no export compliance documentation.
        ITSAppUsesNonExemptEncryption: false
        # Development builds also get NSLocalNetworkUsageDescription and NSAllowsLocalNetworking,
        # for --report; scripts/ios.ts adds them unless built with --release.
    settings:
      PRODUCT_NAME: aerodance
      PRODUCT_BUNDLE_IDENTIFIER: ${IOS_BUNDLE_ID}
      DEVELOPMENT_TEAM: ${IOS_TEAM_ID}
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: NO
      CLANG_ENABLE_OBJC_ARC: YES
      TARGETED_DEVICE_FAMILY: "1,2"
