# XcodeGen spec for the iPhone/iPad app's simulator UI tests; ui.ios.ts generates the project
# outside the repo and runs it. The tests drive the installed app by its bundle ID, so the
# project has no app of its own.
name: AerodanceUITests
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  AerodanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AerodanceUITests.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.isaacthoman.aerodance.uitests
      GENERATE_INFOPLIST_FILE: YES
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_VERSION: "5.0"
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
schemes:
  AerodanceUITests:
    build:
      targets:
        AerodanceUITests: [test]
    test:
      targets: [AerodanceUITests]
