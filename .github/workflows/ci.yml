name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Matches the Dockerfile's node:24-alpine image.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run studio:test
      - run: npm run build
      - run: npm run studio:build

  browser:
    # The canvas UI flow in Chromium; the Dockerfile's ui-test stage brings Playwright.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --target ui-test -t aerodance-ui-browser-test .
      - run: docker run --rm aerodance-ui-browser-test

  webcam:
    # Real MediaPipe models on a synthetic two-person camera: game, calibration and Studio recording.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --target webcam-test -t aerodance-webcam-test .
      - run: docker run --rm aerodance-webcam-test

  studio-browser:
    # Dance Studio in Chromium: editing, video import, duet import and project loading.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f tools/choreography/Dockerfile --target ui-test -t aerodance-studio-browser-test .
      - run: docker run --rm aerodance-studio-browser-test
