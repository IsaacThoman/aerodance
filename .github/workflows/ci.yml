name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to main waits for the release in progress instead of cancelling it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Matches the Dockerfile's node:24-alpine image.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run studio:test
      - run: npm run build
      - run: npm run studio:build

  browser:
    # The canvas UI flow in Chromium; the Dockerfile's ui-test stage brings Playwright.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --target ui-test -t aerodance-ui-browser-test .
      - run: docker run --rm aerodance-ui-browser-test

  studio-browser:
    # Dance Studio in Chromium: project loading, video import and the duet import.
    # Tests that need real-time tracking (Studio's browser.ts, the webcam and webcam-calibration
    # tests) drop stale frames on a 2-core runner, so they run locally or via the Docker targets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f tools/choreography/Dockerfile --target ui-test -t aerodance-studio-browser-test .
      - run: >-
          docker run --rm aerodance-studio-browser-test sh -c
          "node tools/choreography/tests/browser-storage.browser.ts &&
          node tools/choreography/tests/project-loading.browser.ts &&
          node tools/choreography/tests/video-import.browser.ts &&
          node tools/choreography/tests/solo-workflow.browser.ts &&
          node tools/choreography/tests/video-duet.browser.ts"

  release:
    # A push to main that changes the version (release.config.mjs) tags it and creates a GitHub
    # Release, once the checks pass. A run whose commit main has moved past releases nothing;
    # the run for the newer commit does.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, browser, studio-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  testflight:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/testflight.yml
    with:
      version: ${{ needs.release.outputs.version }}
    # A called workflow sees no secrets, its environment's included, unless the caller passes them.
    secrets: inherit
