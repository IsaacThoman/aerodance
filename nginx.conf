# Serves the static game build in the production image, and proxies phone pairing to the
# pairing service. A template: ${NGINX_LOCAL_RESOLVERS} and ${PAIRING_UPSTREAM} are filled in
# when the container starts (see the Dockerfile).

# Each client's new pairing rooms and code entries, by the address the proxy in front of this
# container (Coolify's Traefik, on a private network) saw: the last X-Forwarded-For entry.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
limit_req_zone $binary_remote_addr zone=pair_rooms:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pair_joins:1m rate=30r/m;

server {
    listen 3000;
    root /usr/share/nginx/html;
    # Looked up per request, so the site still starts (and pairing answers 502) without the
    # pairing service.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    # Keep directory redirects (/songs -> /songs/) relative, so they stay on the proxy's public https URL.
    absolute_redirect off;

    # Builds regenerate the song catalog; Song Select must never see a stale one.
    location = /songs/manifest.json {
        add_header Cache-Control "no-store";
    }

    # Not in every nginx mime.types; MediaPipe needs application/wasm to compile its runtime.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
    }

    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    # Phone pairing (packages/pairing/server.ts): JSON requests and server-sent event streams.
    # Pairing tokens ride in the events stream's query string, so these stay out of the log.
    set $pairing ${PAIRING_UPSTREAM};
    limit_req_status 429;
    location /pair/ {
        proxy_pass http://$pairing;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        access_log off;
    }
    location = /pair/rooms {
        limit_req zone=pair_rooms burst=10 nodelay;
        proxy_pass http://$pairing;
        access_log off;
    }
    location ~ "^/pair/rooms/\d{6}/join$" {
        limit_req zone=pair_joins burst=20 nodelay;
        proxy_pass http://$pairing;
        access_log off;
    }
}
