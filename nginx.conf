# Serves the static game build in the production image, and proxies phone pairing to the
# pairing service. A template: ${NGINX_LOCAL_RESOLVERS} and ${PAIRING_UPSTREAM} are filled in
# when the container starts (see the Dockerfile).
server {
    listen 3000;
    root /usr/share/nginx/html;
    # Looked up per request, so the site still starts (and pairing answers 502) without the
    # pairing service.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    # Keep directory redirects (/songs -> /songs/) relative, so they stay on the proxy's public https URL.
    absolute_redirect off;

    # Builds regenerate the song catalog; Song Select must never see a stale one.
    location = /songs/manifest.json {
        add_header Cache-Control "no-store";
    }

    # Not in every nginx mime.types; MediaPipe needs application/wasm to compile its runtime.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
    }

    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    # Phone pairing (packages/pairing/server.ts): JSON requests and server-sent event streams.
    location /pair/ {
        set $pairing ${PAIRING_UPSTREAM};
        proxy_pass http://$pairing;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
