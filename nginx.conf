# Serves the static game build in the production image, and proxies phone pairing to the
# pairing server running beside nginx in the same container (see the Dockerfile).

# Each client's new pairing rooms and code entries, by the address the proxy in front of this
# container (Coolify's Traefik, on a private network) saw: the last X-Forwarded-For entry.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
# CORS preflights (the iPhone/iPad app's game pairs from a loopback origin; server.ts answers
# them) don't count: requests with an empty key aren't limited.
map $request_method $pair_client {
    OPTIONS "";
    default $binary_remote_addr;
}
# Those loopback origins, which may also read nginx's own "too many tries" answer below.
map $http_origin $pair_cors_origin {
    "~^http://(127\.0\.0\.1|localhost|\[::1\])(:\d{1,5})?$" $http_origin;
    default "";
}
limit_req_zone $pair_client zone=pair_rooms:1m rate=10r/m;
limit_req_zone $pair_client zone=pair_joins:1m rate=30r/m;

server {
    listen 3000;
    root /usr/share/nginx/html;
    # Keep directory redirects (/songs -> /songs/) relative, so they stay on the proxy's public https URL.
    absolute_redirect off;
    gzip on;
    gzip_types application/json;

    # Builds regenerate the song catalog; Song Select must never see a stale one.
    location = /songs/manifest.json {
        add_header Cache-Control "no-store";
    }

    # Not in every nginx mime.types; MediaPipe needs application/wasm to compile its runtime.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
    }

    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    # Pose files are stored uncompressed for zero-copy loading; compress them in transport.
    # Only here: MediaPipe's large .task models are octet-stream too and gain nothing from gzip.
    location ~ \.adpose$ {
        types { }
        default_type application/octet-stream;
        gzip_types application/octet-stream;
    }

    # Universal links: with the iPhone/iPad app installed, a game's QR code (/pair/#<code>) opens
    # the app's own phone camera page. Apple fetches this file as JSON; its app ID is
    # scripts/apple.ts's team and bundle ID.
    location = /.well-known/apple-app-site-association {
        types { }
        default_type application/json;
    }

    # The phone camera page, beside pairing's requests under /pair/ (/pair redirects here itself).
    location = /pair/ {
        try_files /pair/index.html =404;
    }
    # Its old address, which links and QR codes from before it moved may still open.
    location = /phone {
        return 301 /pair/$is_args$args;
    }
    location /phone/ {
        return 301 /pair/$is_args$args;
    }

    # Phone pairing (packages/pairing/server.ts): JSON requests and server-sent event streams.
    # Pairing tokens ride in the events stream's query string, so these stay out of the log.
    limit_req_status 429;
    # nginx answers rate-limited requests itself, without server.ts's CORS headers; add them so
    # the app's game can tell the player to wait (an empty origin adds nothing).
    location @pair_limited {
        add_header Access-Control-Allow-Origin $pair_cors_origin always;
        add_header Vary Origin always;
        return 429;
    }
    location /pair/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        access_log off;
    }
    location = /pair/rooms {
        limit_req zone=pair_rooms burst=10 nodelay;
        error_page 429 = @pair_limited;
        proxy_pass http://127.0.0.1:3001;
        access_log off;
    }
    # The relay's WebSockets (packages/pairing/relay.ts), for games without WebRTC (Apple TV).
    location ~ "^/pair/rooms/\d{6}/link$" {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        access_log off;
    }
    location ~ "^/pair/rooms/\d{6}/join$" {
        limit_req zone=pair_joins burst=20 nodelay;
        error_page 429 = @pair_limited;
        proxy_pass http://127.0.0.1:3001;
        access_log off;
    }
}
